# Builds the game for Windows, Linux and macOS and publishes all three on GitHub. Nothing is
# published unless all of them build.
#   - push a tag like v0.2.0 (the version in Cargo.toml must match), or
#   - run it by hand from the Actions tab and give an existing tag (for a release that was tagged
#     before this workflow existed).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.1.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  MOLTENVK: v1.4.2
  MOLTENVK_SHA256: f95765a6229cb7b915990a2890ce12ebe36a730b021545d3d52ae69ce4c4024e
  APPIMAGETOOL: 1.9.1
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  APPIMAGE_RUNTIME: 20251108
  APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows-x64, exe: weft.exe }
          # The oldest available, since a Linux build only runs on this glibc or newer.
          - { os: ubuntu-22.04, platform: linux-x64, exe: weft }
          - { os: macos-latest, platform: macos-arm64, exe: weft }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Tag matches the version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match version $version in Cargo.toml"
            exit 1
          fi
          echo "ARCHIVE=Weft-$version-${{ matrix.platform }}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      # The game and every mod in the workspace; `--dist` then packs the mods.
      - name: Build
        run: cargo build --release --workspace

      - name: Make the distribution
        shell: bash
        run: |
          target/release/${{ matrix.exe }} --dist dist/Weft
          test -f dist/Weft/${{ matrix.exe }}
          test -n "$(ls dist/Weft/run/mods)"

      # Macs have no Vulkan of their own: the game carries the official MoltenVK and its license,
      # so players need no Vulkan SDK.
      - name: MoltenVK
        if: runner.os == 'macOS'
        run: |
          curl -fsSL -o moltenvk.tar "https://github.com/KhronosGroup/MoltenVK/releases/download/$MOLTENVK/MoltenVK-macos.tar"
          echo "$MOLTENVK_SHA256  moltenvk.tar" | shasum -a 256 -c -
          tar xf moltenvk.tar
          cp MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib dist/Weft/
          cp MoltenVK/LICENSE dist/Weft/MoltenVK-LICENSE

      # The same distribution as one file to run, next to the tar. No Vulkan, drivers or sound
      # library in it: those have to be the player's own. It is read-only when running, which
      # the game doesn't mind, writing to the player's folders.
      - name: AppImage
        if: runner.os == 'Linux'
        env:
          ARCH: x86_64
          # The tool is an AppImage itself, and this machine has no FUSE to run one.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL/appimagetool-x86_64.AppImage"
          curl -fsSL -o appimage-runtime "https://github.com/AppImage/type2-runtime/releases/download/$APPIMAGE_RUNTIME/runtime-x86_64"
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum -c -
          echo "$APPIMAGE_RUNTIME_SHA256  appimage-runtime" | sha256sum -c -
          chmod +x appimagetool
          cp -r dist/Weft AppDir
          cp .github/appimage/AppRun .github/appimage/weft.desktop AppDir/
          cp crates/engine/assets/icon.png AppDir/weft.png
          chmod +x AppDir/AppRun
          ./appimagetool --no-appstream --runtime-file appimage-runtime AppDir "$ARCHIVE.AppImage"
          # What it holds, as far as a machine with no GPU can tell.
          chmod +x "$ARCHIVE.AppImage"
          "./$ARCHIVE.AppImage" --appimage-extract > /dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/weft
          test -f squashfs-root/assets/core/icon.png
          test -n "$(ls squashfs-root/run/mods)"

      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Weft -DestinationPath "$env:ARCHIVE.zip"

      # A tar keeps the permission to run the game, which a zip made here would lose.
      - name: Pack (Linux, macOS)
        if: runner.os != 'Windows'
        run: tar -czf "$ARCHIVE.tar.gz" -C dist Weft

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: Weft-*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The notes of this commit, whatever the tag being released contains.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/release-notes.md

      - uses: actions/download-artifact@v8
        with:
          path: archives
          merge-multiple: true

      - name: Publish
        run: |
          gh release create "$TAG" archives/* \
            --verify-tag --title "Weft ${TAG#v}" \
            --notes-file .github/release-notes.md --generate-notes
